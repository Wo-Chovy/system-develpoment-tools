[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "greetlab-25020007009"
version = "0.1.0"

[project.scripts]
sdt-greet = "greetlab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle错误
  "W",   # pycodestyle警告
  "F",   # pyflakes
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
